name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # WPF, the registry (private hive files) and the Windows shell are part of the tests, so they run on Windows.
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CleanSuite.sln

      - name: Code style (.editorconfig)
        run: dotnet format whitespace CleanSuite.sln --no-restore --verify-no-changes

      - name: Build (warnings are errors)
        run: dotnet build CleanSuite.sln -c Release --no-restore

      - name: Test with coverage
        run: dotnet test CleanSuite.sln -c Release --no-build --logger trx --results-directory TestResults -s coverage.runsettings --collect:"XPlat Code Coverage"

      # The engines (every assembly except the desktop program) must stay at 80 % line coverage or more; the desktop
      # program's coverage is reported, not enforced (its pages are checked with the --snapshot aid).
      - name: Coverage threshold
        shell: pwsh
        run: |
          $file = Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
          if (-not $file) { throw 'No coverage report was written.' }
          [xml]$report = Get-Content $file.FullName
          $lines = 0; $covered = 0
          foreach ($p in $report.coverage.packages.package) {
            $rate = [double]$p.'line-rate'
            "{0,-28} {1,6:P1}" -f $p.name, $rate
            if ($p.name -eq 'CleanSuite.App') { continue }
            foreach ($c in $p.classes.class) { foreach ($l in $c.lines.line) { $lines++; if ([int]$l.hits -gt 0) { $covered++ } } }
          }
          $engines = if ($lines) { $covered / $lines } else { 0 }
          "Engines: {0:P1} of {1} lines" -f $engines, $lines
          if ($engines -lt 0.80) { throw ("Engine line coverage {0:P1} is below 80 %" -f $engines) }

      - name: Vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list CleanSuite.sln package --vulnerable --include-transitive
          $report
          if ($report -match 'has the following vulnerable packages') { exit 1 }

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  # A tag "v1.2.3" builds the installer the same way build.ps1 does on a developer's computer and publishes it as a draft release
  # with its SHA-256. With the SIGNPATH_API_TOKEN secret set, the two programs, the uninstaller and the installer are signed
  # (Authenticode, SignPath Foundation; docs/CODE_SIGNING.md); without it the release is built unsigned as before.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    # Each signing request waits for a person to approve it in SignPath (two per release).
    timeout-minutes: 300
    permissions:
      contents: write
      actions: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Version and release notes
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT
          # Release notes: this version's section of CHANGELOG.md.
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l.StartsWith("## [$version]") })
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version" }
          $end = [Array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l.StartsWith('## ') })
          if ($end -lt 0) { $end = $lines.Length }
          $lines[($start + 1)..($end - 1)] | Out-File release-notes.md -Encoding utf8

      - name: Programs
        shell: pwsh
        run: ./build.ps1 -SkipTests -SkipInstaller -Version ${{ steps.version.outputs.version }}

      - name: Installer (unsigned)
        if: env.SIGNPATH_API_TOKEN == ''
        shell: pwsh
        run: |
          Write-Host '::warning::SIGNPATH_API_TOKEN is not set: this release is not signed (docs/CODE_SIGNING.md).'
          ./build.ps1 -SkipTests -SkipPublish -Version ${{ steps.version.outputs.version }}

      # Signed build. Inno Setup writes its uninstaller (uninst-*.e32) for signing and stops; it is signed together with the two
      # programs, put back under its own name, and the installer is built from the signed files and signed last.
      - name: Files to sign
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $e32 = ./build.ps1 -SkipTests -SkipPublish -SignedUninstallerDir artifacts/uninst -PrepareUninstaller -Version ${{ steps.version.outputs.version }} |
            Select-Object -Last 1
          New-Item -ItemType Directory -Force artifacts/to-sign | Out-Null
          Copy-Item artifacts/publish/CleanSuite.App.exe, artifacts/publish/CleanSuite.Cli.exe artifacts/to-sign
          Copy-Item $e32 artifacts/to-sign/uninst.exe
          "e32=$e32" >> $env:GITHUB_OUTPUT

      - name: Upload programs for signing
        id: upload-programs
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: programs-unsigned
          path: artifacts/to-sign/
          if-no-files-found: error

      - name: Sign programs (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: programs
          github-artifact-id: ${{ steps.upload-programs.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: artifacts/signed-programs

      - name: Installer from the signed files
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          Copy-Item artifacts/signed-programs/CleanSuite.App.exe, artifacts/signed-programs/CleanSuite.Cli.exe artifacts/publish -Force
          Copy-Item artifacts/signed-programs/uninst.exe '${{ steps.unsigned.outputs.e32 }}' -Force
          ./build.ps1 -SkipTests -SkipPublish -SignedUninstallerDir artifacts/uninst -Version ${{ steps.version.outputs.version }}
          New-Item -ItemType Directory -Force artifacts/installer-unsigned | Out-Null
          Move-Item artifacts/installer/CleanSuite-Setup-*.exe artifacts/installer-unsigned

      - name: Upload installer for signing
        id: upload-installer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: artifacts/installer-unsigned/
          if-no-files-found: error

      - name: Sign installer (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: artifacts/installer

      - name: Check signatures
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $files = @(Get-Item artifacts/installer/CleanSuite-Setup-*.exe, artifacts/publish/*.exe, '${{ steps.unsigned.outputs.e32 }}')
          $bad = 0
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            "{0,-36} {1,-6} {2}" -f $f.Name, $s.Status, $s.SignerCertificate.Subject
            if ($s.Status -ne 'Valid') { $bad++ }
          }
          if ($bad) { throw "$bad file(s) without a valid signature" }

      - name: SHA-256
        shell: pwsh
        run: |
          $name = "CleanSuite-Setup-${{ steps.version.outputs.version }}.exe"
          $setup = "artifacts/installer/$name"
          (Get-FileHash $setup -Algorithm SHA256).Hash + "  $name" | Out-File "$setup.sha256" -Encoding ascii

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: CleanSuite ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/installer/CleanSuite-Setup-*.exe
            artifacts/installer/CleanSuite-Setup-*.exe.sha256
