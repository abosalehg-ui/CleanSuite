name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # WPF, the registry (private hive files) and the Windows shell are part of the tests, so they run on Windows.
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CleanSuite.sln

      - name: Build (warnings are errors)
        run: dotnet build CleanSuite.sln -c Release --no-restore

      - name: Test with coverage
        run: dotnet test CleanSuite.sln -c Release --no-build --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"

      - name: Vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list CleanSuite.sln package --vulnerable --include-transitive
          $report
          if ($report -match 'has the following vulnerable packages') { exit 1 }

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
